name: Feature request
description: Propose an improvement for iPhone, iPad, or Mac.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should ScriptWidget solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe the workflow and relevant platform(s).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This request targets iOS, iPadOS, or macOS.
          required: true
