name: Bug report
description: Report reproducible ScriptWidget behavior.
title: "[Bug]: "
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [iPhone, iPad, Mac]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: ScriptWidget, OS, and device versions.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include a minimal script when possible, with secrets removed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste Problems/Console output and screenshots. Remove credentials and personal data.
