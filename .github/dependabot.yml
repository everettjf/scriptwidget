version: 2
updates:
  - package-ecosystem: npm
    directory: /Editor/editorfe
    schedule:
      # Batch routine dependency maintenance into two planned review windows.
      interval: semiannually
    open-pull-requests-limit: 1
    groups:
      editor-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: semiannually
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: swift
    directory: /iOS
    schedule:
      interval: semiannually
    open-pull-requests-limit: 1
    groups:
      ios-packages:
        patterns:
          - "*"

  - package-ecosystem: swift
    directory: /macOS
    schedule:
      interval: semiannually
    open-pull-requests-limit: 1
    groups:
      macos-packages:
        patterns:
          - "*"
