name: Web Browsers

# Runs the Web Studio and the browser preview engine in Chromium, Firefox,
# and WebKit on Linux and Windows: rendering, template and .swt import flows,
# byte-identical tree parity with the native runtime, and sandbox isolation.
on:
  push:
    paths:
      - 'Web/**'
      - 'site/**'
      - 'Editor/editorfe/src/**'
      - 'Shared/ScriptWidgetRuntime/Widget/Resource/support.bundle/**'
      - '.github/workflows/web-browsers.yml'
  pull_request:
    paths:
      - 'Web/**'
      - 'site/**'
      - 'Editor/editorfe/src/**'
      - '.github/workflows/web-browsers.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-browsers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browsers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # Keep LF endings so sources match what the native runtime reads.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Web/studio/package-lock.json
      - run: npm ci
        working-directory: Web/studio
      - name: Install Playwright browsers
        working-directory: Web/studio
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Build engine check page and Studio
        run: |
          node Web/preview-engine/scripts/build-browser.mjs
          npm run build --prefix Web/studio
      - name: Engine unit and parity tests
        working-directory: Web/preview-engine
        run: npm test
      - name: Cross-browser checks
        working-directory: Web/studio
        run: node scripts/cross-browser.ts chromium firefox webkit
      - name: Homepage code and preview across browsers
        working-directory: Web/studio
        run: node scripts/hero-browsers.ts chromium firefox webkit
