name: Android
on:
  pull_request:
    paths: ['Android/**', 'Web/preview-engine/src/**', 'Shared/ScriptWidgetRuntime/Widget/Resource/support.bundle/**', 'Editor/editorfe/**', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['Android/**', 'Web/preview-engine/src/**', 'Shared/ScriptWidgetRuntime/Widget/Resource/support.bundle/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: 24}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: 21}
      - name: Install the bundler used for the shared renderer
        run: npm ci
        working-directory: Web/studio
      - name: Generated JavaScript assets match their sources
        run: |
          node Android/scripts/build-shared-js.mjs
          git diff --exit-code -- Android/core/src/main/assets/scriptwidget
      - name: Unit tests and a release build
        run: ./gradlew :core:testDebugUnitTest :app:assembleRelease
        working-directory: Android
  # Device tests (QuickJS parity with JavaScriptCore, rendering, native APIs)
  # need a device or emulator: run Android/scripts/device-test.sh locally.
  # The core instrumented suite (QuickJS parity with JavaScriptCore, rendering, native APIs) on an
  # emulator. Started by hand only: Actions > Android > Run workflow. An emulator is not a phone;
  # the suites on a real device are still run with Android/scripts/device-test.sh.
  device:
    name: Device tests on an emulator
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: 24}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: 21}
      - name: Install the bundler used for the shared renderer
        run: npm ci
        working-directory: Web/studio
      - name: Shared JavaScript and the parity corpus the device tests read
        run: node Android/scripts/build-shared-js.mjs
      - name: Let the runner use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: false
          script: |
            sh Android/scripts/device-test.sh core | tee device-test.log
            FLAVOR=foss sh Android/scripts/device-test.sh app | tee app-device-test.log
            grep -q "^OK (" device-test.log && grep -q "^OK (" app-device-test.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-core-device-test
          path: |
            device-test.log
            app-device-test.log
          if-no-files-found: ignore
