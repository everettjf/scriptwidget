name: Android
on:
  pull_request:
    paths: ['Android/**', 'Web/preview-engine/src/**', 'Shared/ScriptWidgetRuntime/Widget/Resource/support.bundle/**', 'Editor/editorfe/**', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['Android/**', 'Web/preview-engine/src/**', 'Shared/ScriptWidgetRuntime/Widget/Resource/support.bundle/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: 24}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: 21}
      - name: Install the bundler used for the shared renderer
        run: npm ci
        working-directory: Web/studio
      - name: Generated JavaScript assets match their sources
        run: |
          node Android/scripts/build-shared-js.mjs
          git diff --exit-code -- Android/core/src/main/assets/scriptwidget
      - name: Unit tests and a release build
        run: ./gradlew :core:testDebugUnitTest :app:assembleRelease
        working-directory: Android
  # Device tests (QuickJS parity with JavaScriptCore, rendering, native APIs)
  # need a device or emulator: run Android/scripts/device-test.sh locally.
