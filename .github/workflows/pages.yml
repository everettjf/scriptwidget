name: pages
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'Web/**'
      - 'Editor/editorfe/src/**'
      - 'Shared/ScriptWidgetRuntime/Widget/Resource/support.bundle/**'
      - 'Shared/ScriptWidgetRuntime/Resource/Script.bundle/template/**'
      - 'Gallery/widgets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Web/studio/package-lock.json
      - name: Install shared editor dependencies
        working-directory: Editor/editorfe
        run: npm ci
      - name: Build Web Studio
        working-directory: Web/studio
        run: npm ci && npm test && npm run build
      - name: Verify homepage code and preview
        run: node Web/studio/scripts/hero-smoke.ts
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R site/. _site/
          cp -R Web/studio/dist _site/studio
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v5
